services:
  app:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    container_name: nginx-proxy-manager
    ports:
      # These ports are in format <host-port>:<container-port>
      - ${NGINX_APP_HTTP_PORT}:80 # Public HTTP Port
      - ${NGINX_APP_HTTPS_PORT}:443 # Public HTTPS Port
      - ${NGINX_APP_ADMIN_PORT}:81 # Admin Web Port
      # Uncomment this if IPv6 is not enabled on your host
      # DISABLE_IPV6: 'true'
    volumes:
      - ${NGINX_APP_DATA_VOL}:/data
      - ${NGINX_APP_LETSENCRYPT_VOL}:/etc/letsencrypt
networks:
  default:
    name: reverse-proxy
