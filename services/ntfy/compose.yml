services:
  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    command:
      - serve
    environment:
      - TZ=UTC    # optional: set desired timezone
    user: ${NTFY_UID}:${NTFY_GID} # optional: replace with your own user/group or uid/gid
    volumes:
      - ${NTFY_CACHE_VOL}:/var/cache/ntfy
      - ${NTFY_NTFY_VOL}:/etc/ntfy
    networks:
      - reverse-proxy
    healthcheck: # optional: remember to adapt the host:port to your environment
        test: ["CMD-SHELL", "wget -q --tries=1 ${NTFY_DOMAIN}:${NTFY_PORT}/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 40s
    restart: unless-stopped
    init: true # needed, if healthcheck is used. Prevents zombie processes

networks:
  reverse-proxy:
    external: true
